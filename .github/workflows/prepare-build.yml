
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-estrutura-inicial.zip'
      - '.github/workflows/prepare-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LanceAI ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -oq LanceAI-estrutura-inicial.zip -d extracted

          if [ -d extracted/LanceAI ]; then
            cp -a extracted/LanceAI/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f .github/workflows/android-apk.yml

      - name: Configure Android SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager não encontrado"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build LanceAI APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Commit extracted project
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Prepare LanceAI Android project"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
