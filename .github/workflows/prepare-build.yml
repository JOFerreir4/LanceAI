
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-estrutura-inicial.zip'
      - '.github/workflows/prepare-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -oq LanceAI-estrutura-inicial.zip -d extracted

          echo "Arquivos encontrados:"
          find extracted -name settings.gradle.kts

          PROJECT_FILE=$(find extracted \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: settings.gradle.kts não encontrado"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cp -a "$PROJECT_DIR"/. .

          echo "Projeto preparado na raiz."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project
        run: |
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Commit project
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Prepare LanceAI Android project"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
