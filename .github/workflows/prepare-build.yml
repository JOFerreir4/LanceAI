
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-estrutura-inicial.zip'
      - '.github/workflows/prepare-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LanceAI ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -oq LanceAI-estrutura-inicial.zip -d extracted

          PROJECT_FILE=$(find extracted \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Projeto Gradle não encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cp -a "$PROJECT_DIR"/. .
          rm -rf extracted

      - name: Configure Android SDK
        run: |
          set -e

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f -name sdkmanager \
              | sort -V | tail -n 1)
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Projeto encontrado!"

      - name: Fix Coil 3 dependency
        run: |
          set -e

          for file in app/build.gradle.kts gradle/libs.versions.toml; do
            if [ -f "$file" ]; then
              sed -i \
                's/io.coil-kt:coil-compose:3.3.0/io.coil-kt.coil3:coil-compose:3.3.0/g' \
                "$file"
            fi
          done

          grep -RIn "coil-compose" app gradle || true

      - name: Build LanceAI APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Commit project
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix LanceAI Coil dependency and prepare project"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
