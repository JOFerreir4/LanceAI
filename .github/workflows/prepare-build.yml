
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-estrutura-inicial.zip'
      - '.github/workflows/prepare-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LanceAI ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -oq LanceAI-estrutura-inicial.zip -d extracted

          if [ -d extracted/LanceAI ]; then
            cp -a extracted/LanceAI/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit extracted project
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract LanceAI project"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
