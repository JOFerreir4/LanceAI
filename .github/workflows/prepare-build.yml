
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-v1.1-calculadora.zip'
      - '.github/workflows/prepare-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LanceAI 1.1
        run: |
          set -e
          mkdir -p extracted

          unzip -oq LanceAI-v1.1-calculadora.zip -d extracted

          PROJECT_FILE=$(find extracted \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: Projeto Gradle não encontrado"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cp -a "$PROJECT_DIR"/. .
          rm -rf extracted

      - name: Configure Android SDK
        run: |
          set -e

          SDKMANAGER=$(command -v sdkmanager || true)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f -name sdkmanager \
              | sort -V | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project
        run: |
          set -e
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Projeto LanceAI 1.1 encontrado"

      - name: Fix Coil dependency
        run: |
          set -e

          find app -type f \
            \( -name '*.kts' -o -name '*.toml' \) \
            -exec sed -i \
            's/io.coil-kt:coil-compose:3.3.0/io.coil-kt.coil3:coil-compose:3.3.0/g' {} \;

          echo "Verificando dependência Coil:"
          grep -RIn "coil-compose" app || true

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
