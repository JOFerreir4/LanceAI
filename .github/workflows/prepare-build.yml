
name: Extract and build LanceAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'LanceAI-estrutura-inicial.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -oq LanceAI-estrutura-inicial.zip -d extracted
          if [ -d extracted/LanceAI ]; then
            cp -a extracted/LanceAI/. .
          else
            cp -a extracted/. .
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Save extracted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract LanceAI project"

      - uses: actions/upload-artifact@v4
        with:
          name: LanceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
